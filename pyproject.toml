[project]
name = "growthlab"
version = "0.1.0"
description = "Customer Lifetime Value & causal uplift decision engine for retention campaigns."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suelma Pina" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # data
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",      # Online Retail II ships as .xlsx
    "requests>=2.31",
    # modelling
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pymc-marketing>=0.10", # BG/NBD + Gamma-Gamma
    "econml>=0.15",         # CATE meta-learners / causal forests
    # tracking, serving & demo
    "mlflow>=2.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "streamlit>=1.33",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "httpx>=0.27",        # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growthlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
